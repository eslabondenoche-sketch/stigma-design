<link rel="stylesheet" href="../styles.css">
<div style="height:150px;display:flex;font-family:var(--font-sans);font-size:13px">
<div style="flex:1;background:var(--bone);color:var(--charcoal);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px"><b>Charcoal on bone</b><span style="opacity:.6">correcto</span></div>
<div style="flex:1;background:var(--charcoal);color:var(--bone);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px"><b>Bone on charcoal</b><span style="opacity:.6">correcto</span></div>
<div style="flex:1;background:var(--charcoal);color:var(--lemon);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px"><b>Lemon on charcoal</b><span style="opacity:.6">correcto</span></div>
<div style="flex:1;background:var(--bone);color:var(--lemon);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px"><b>Lemon on bone</b><span style="opacity:.6">✕ evitar</span></div>
</div>
