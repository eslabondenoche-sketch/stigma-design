<!-- @dsCard group="Spacing" viewport="700x220" name="Spacing Scale" subtitle="4px base scale, --space-1 to --space-8" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:220px;background:var(--surface-page);padding:16px 24px;box-sizing:border-box;font-family:var(--font-sans);font-size:11px;color:var(--text-muted-on-light);display:flex;flex-direction:column;gap:6px;justify-content:center">
<div style="display:flex;align-items:center;gap:10px"><span style="width:56px">4px</span><div style="height:10px;width:var(--space-1);background:var(--charcoal)"></div></div>
<div style="display:flex;align-items:center;gap:10px"><span style="width:56px">8px</span><div style="height:10px;width:var(--space-2);background:var(--charcoal)"></div></div>
<div style="display:flex;align-items:center;gap:10px"><span style="width:56px">12px</span><div style="height:10px;width:var(--space-3);background:var(--charcoal)"></div></div>
<div style="display:flex;align-items:center;gap:10px"><span style="width:56px">16px</span><div style="height:10px;width:var(--space-4);background:var(--charcoal)"></div></div>
<div style="display:flex;align-items:center;gap:10px"><span style="width:56px">24px</span><div style="height:10px;width:var(--space-5);background:var(--charcoal)"></div></div>
<div style="display:flex;align-items:center;gap:10px"><span style="width:56px">32px</span><div style="height:10px;width:var(--space-6);background:var(--charcoal)"></div></div>
<div style="display:flex;align-items:center;gap:10px"><span style="width:56px">48px</span><div style="height:10px;width:var(--space-7);background:var(--charcoal)"></div></div>
</div>
