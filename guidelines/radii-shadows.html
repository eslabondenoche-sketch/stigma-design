<!-- @dsCard group="Spacing" viewport="700x170" name="Radii &amp; Shadows" subtitle="sm/md/lg/pill corners, soft card shadow" -->
<link rel="stylesheet" href="../styles.css">
<div style="height:170px;background:var(--surface-page);display:flex;align-items:center;justify-content:center;gap:20px;font-family:var(--font-sans);font-size:11px;color:var(--text-muted-on-light)">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--surface-card);border-radius:var(--radius-sm);box-shadow:var(--shadow-card)"></div>sm 8px</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--surface-card);border-radius:var(--radius-md);box-shadow:var(--shadow-card)"></div>md 14px</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--surface-card);border-radius:var(--radius-lg);box-shadow:var(--shadow-card)"></div>lg 22px</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:64px;height:64px;background:var(--lemon);border-radius:var(--radius-pill)"></div>pill</div>
</div>
